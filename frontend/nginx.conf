# Serves the built SPA and proxies API + WebSocket to the backend service.
# Everything is same-origin here, so the browser never hits CORS.

server {
    listen 80;
    server_name _;

    # REST API → backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Analyst/live calls can be slow behind rate-limit backoffs.
        proxy_read_timeout 300s;
    }

    # WebSocket event stream → backend, with the upgrade handshake.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A game can run many minutes; don't cut the socket on idle.
        proxy_read_timeout 3600s;
    }

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
