openrouter:
  base_url: https://openrouter.ai/api/v1
  # VERIFY before first live run: python scripts/verify_models.py
  # OpenRouter's free lineup rotates. Fallback that always works: openrouter/free
  # gpt-oss-120b:free rotated out of the free lineup (verify_models, 2026-07-16);
  # gpt-oss-20b:free is live and was a PLAN.md-recommended pick.
  white_model: openai/gpt-oss-20b:free
  # llama-3.3-70b and qwen3-coder both rotated out (verify_models, 2026-08-07);
  # replaced with instruct-tuned models that are live+free today.
  black_model: google/gemma-4-31b-it:free
  analyst_model: nvidia/nemotron-3-super-120b-a12b:free
  commentator_model: google/gemma-4-26b-a4b-it:free   # live move commentary (Feature 2)
  fallback_model: openrouter/free
  request_timeout_s: 60
  # Free-tier models are reasoning models: they spend 75-300 tokens thinking
  # before emitting the JSON move, and those count as completion tokens. At 300
  # the budget was exhausted mid-reasoning (finish_reason="length"), so the move
  # never arrived -- gpt-oss-20b returned content=None, nemotron returned raw
  # truncated prose. Both surfaced as bogus "illegal moves" and forfeits.
  max_tokens_move: 1000
  max_tokens_analysis: 1500
  max_tokens_commentary: 120         # one or two spoken sentences per move

throttle:
  min_seconds_between_requests: 4    # 15/min, safely under the 20/min cap
  max_requests_per_game: 250         # hard kill-switch

game:
  max_moves: 120                     # engine adjudicates draw beyond this
  illegal_move_retries: 3            # then random legal move fallback
  live_commentary_every_n_moves: 0   # 0 = off (saves quota); 5 = chatty mode
  move_delay_ui_ms: 800              # min pacing so the UI feels watchable
  too_slow_window_ms: 5000           # "Too Slow" per-move live-thinking window

# Voice/move commentary synced to the board (Feature 2). One extra LLM call per
# commented move in live mode; template fallback keeps the voice from going
# silent, and mock mode always uses templates (zero calls).
commentary:
  enabled: true
  every_n_moves: 1

# mock = zero API calls (MockPlayer/MockAnalyst). live = real OpenRouter calls.
# Default is mock per the project's working rules; switch to live only for an
# explicit, budgeted live run.
mode: mock
